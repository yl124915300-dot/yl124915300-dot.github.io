name: Cat Tales real cat sound smoke test (isolated)
on:
  push:
    branches:
      - cat-tales/real-meow-audio-eval-20261017
permissions:
  contents: write
jobs:
  real-audio-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source YAMNet dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet tensorflow-cpu==2.17.1 tensorflow-hub==0.16.1 tf-keras==2.17.0
          command -v ffmpeg
      - name: Analyze original licensed short-video audio
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, json, os, pathlib, subprocess, urllib.parse, urllib.request
          from datetime import datetime, timezone
          import numpy as np
          import tensorflow as tf
          import tensorflow_hub as hub

          # License and author come from source file description pages, not model output.
          entries = [
              {
                "id":"cat_holly_bird_chirp", "file":"Cat making noises at the birds outside.webm",
                "description_page":"https://commons.wikimedia.org/wiki/File:Cat_making_noises_at_the_birds_outside.webm",
                "author":"Ali T", "license":"CC BY 2.0", "expected":"cat_chirrup"
              },
              {
                "id":"cat_thunderstorm_meow", "file":"Thunderstorm in Onex - 20062013 - falling hailstones.webm",
                "description_page":"https://commons.wikimedia.org/wiki/File:Thunderstorm_in_Onex_-_20062013_-_falling_hailstones.webm",
                "author":"Clément Bucco-Lechat", "license":"CC BY-SA 3.0", "expected":"cat_meow_in_noisy_background"
              },
              {
                "id":"dog_bark_negative", "file":"Dog barking.webm",
                "description_page":"https://commons.wikimedia.org/wiki/File:Dog_barking.webm",
                "author":"Dr. Nono YesMaybe", "license":"CC BY-SA 4.0", "expected":"dog_bark_not_cat"
              },
          ]

          # The official 521-class YAMNet weights; this is sound-event classification, NOT translation.
          source_model = "https://tfhub.dev/google/yamnet/1"
          print("CAT_TALES_MODEL_LOADING official="+source_model, flush=True)
          model = hub.load(source_model)
          classes = list(csv.DictReader(open(model.class_map_path().numpy().decode(),"r",encoding="utf-8")))
          assert len(classes)==521
          feline = {"Meow","Purr","Hiss","Caterwaul"}
          cat_indices = {int(x["index"]) for x in classes if x["display_name"] in feline}
          assert len(cat_indices)==4
          results = []
          for entry in entries:
              row = {k:entry[k] for k in ("id","description_page","author","license","expected")}
              url = "https://commons.wikimedia.org/wiki/Special:Redirect/file/" + urllib.parse.quote(entry["file"])
              try:
                  headers = {
                      "User-Agent":"CatTales-SoundResearch/0.1 (noncommercial audit; public licensed media)",
                      "Accept":"video/webm, audio/webm, application/octet-stream",
                  }
                  request = urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(request,timeout=35) as stream:
                      resolved = stream.geturl()
                      host = urllib.parse.urlparse(resolved).hostname
                      if host not in ("upload.wikimedia.org","commons.wikimedia.org"):
                          raise ValueError("unexpected_media_host:"+str(host))
                      raw = stream.read(16*1024*1024+1)
                      if len(raw)>16*1024*1024:
                          raise ValueError("media_too_large")
                  if not raw or not raw.startswith(bytes.fromhex("1a45dfa3")):
                      raise ValueError("not_webm")
                  fname = "sample_"+entry["id"]+".webm"
                  pathlib.Path(fname).write_bytes(raw)
                  decoded = subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-nostdin",
                      "-i",fname,"-t","20","-ac","1","-ar","16000","-f","f32le","-"],
                      stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=45,check=True)
                  waveform = np.frombuffer(decoded.stdout,dtype="<f4").copy()
                  if waveform.size<1600:
                      raise ValueError("no_audible_waveform")
                  scores, _, _ = model(tf.convert_to_tensor(waveform,dtype=tf.float32))
                  a=scores.numpy()
                  indices=np.argsort(a.mean(axis=0))[-5:][::-1]
                  best_per_patch=np.argmax(a,axis=1)
                  cat_patches=[i for i,winner in enumerate(best_per_patch) if int(winner) in cat_indices]
                  row.update(status="MODEL_INFERENCE_COMPLETE",
                     sha256=hashlib.sha256(raw).hexdigest(),
                     media_bytes=len(raw),
                     sound_seconds=round(len(waveform)/16000,3),
                     yamnet_patches=len(a),
                     top_mean_classes=[{"label":classes[int(j)]["display_name"],
                                       "score":round(float(a.mean(axis=0)[j]),5)} for j in indices],
                     feline_top_class_patch_count=len(cat_patches),
                     feline_top_patch_time_ranges_s=[[round(i*.48,2),round(i*.48+.96,2)] for i in cat_patches],
                     mean_meow_score=round(float(a[:,78].mean()),5),
                     max_meow_score=round(float(a[:,78].max()),5))
              except Exception as exc:
                  row.update(status="NOT_EVALUATED",error_type=type(exc).__name__,error=str(exc)[:250])
              finally:
                  try: pathlib.Path("sample_"+entry["id"]+".webm").unlink(missing_ok=True)
                  except Exception: pass
              results.append(row)
              print("CAT_TALES_CLIP="+json.dumps(row,ensure_ascii=False),flush=True)
          result = {
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "model": source_model,
              "assessment":"Real short-media original sound-event candidates; scores are uncalibrated; no claim of translation, motivation, emotional state, or cat language comprehension.",
              "clips":results,
              "model_success_count":sum(v["status"]=="MODEL_INFERENCE_COMPLETE" for v in results)
          }
          pathlib.Path("cat_tales_real_audio_results.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print("CAT_TALES_REAL_AUDIO_RESULT="+json.dumps(result,ensure_ascii=False),flush=True)
          if result["model_success_count"]==0:
              raise SystemExit("no_real_media_test_completed")
          PY
      - name: Upload only JSON measurements (never third-party media)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-tales-real-audio-measurements
          path: cat_tales_real_audio_results.json
          retention-days: 5
          if-no-files-found: ignore

      - name: Preserve summary on isolated branch only
        if: always()
        shell: bash
        run: |
          mkdir -p cat-tales/evidence/real-audio-20261017
          if test -f cat_tales_real_audio_results.json; then
            cp cat_tales_real_audio_results.json cat-tales/evidence/real-audio-20261017/result.json
          else
            python - <<'PY'
          import json,os,pathlib
          pathlib.Path('cat-tales/evidence/real-audio-20261017/result.json').write_text(
              json.dumps({'status':'NOT_RUN','reason':'prerequisite_failed_before_model_results','run_id':os.getenv('GITHUB_RUN_ID'),
                          'run_url':'https://github.com/'+os.getenv('GITHUB_REPOSITORY','')+'/actions/runs/'+os.getenv('GITHUB_RUN_ID','')},
                         indent=2))
          PY
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cat-tales/evidence/real-audio-20261017/result.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(cat-tales): record licensed real-short sound results"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
