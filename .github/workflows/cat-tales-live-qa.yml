name: Cat Tales Live cloud QA
on:
  pull_request:
    paths:
      - 'cat-tales/live/**'
      - '.github/workflows/cat-tales-live-qa.yml'
  push:
    branches: [main]
    paths:
      - 'cat-tales/live/**'
      - '.github/workflows/cat-tales-live-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and safety checks
        run: node --test cat-tales/live/dialogue.test.cjs cat-tales/live/vision-policy.test.cjs cat-tales/live/motion-policy.test.cjs cat-tales/live/beta.test.cjs
      - name: Install isolated browser test tool
        run: npm install --prefix /tmp/cattales-qa --no-package-lock --no-save playwright@1.55.1
      - name: Host the static app for browser checks
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/cat-tales-http.log 2>&1 &
          sleep 3
      - name: Real Chrome browser interaction with fake devices
        run: NODE_PATH=/tmp/cattales-qa/node_modules node cat-tales/live/e2e.cjs
      - name: Private beta feedback export on mobile viewport
        run: NODE_PATH=/tmp/cattales-qa/node_modules node cat-tales/live/beta.e2e.cjs

      - name: Cat-branded mobile UI and privacy-safe keepsake
        run: NODE_PATH=/tmp/cattales-qa/node_modules node cat-tales/live/cat-ui.e2e.cjs

      - name: Actual YAMNet audio model load and live inference
        run: NODE_PATH=/tmp/cattales-qa/node_modules node cat-tales/live/model-smoke.cjs

      - name: Retrieve rights-checked upstream vision fixture for real inference QA only
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 -o cat-tales/live/vision-fixture.jpg https://storage.googleapis.com/mediapipe-tasks/object_detector/cat_and_dog.jpg
          test "$(stat -c%s cat-tales/live/vision-fixture.jpg)" -gt 10000
      - name: Actual EfficientDet vision model load and cat/dog image inference
        run: NODE_PATH=/tmp/cattales-qa/node_modules node cat-tales/live/vision-smoke.cjs
      - name: End-to-end local camera-frame cat detection with real model and shutdown
        run: NODE_PATH=/tmp/cattales-qa/node_modules node cat-tales/live/vision-live-smoke.cjs
