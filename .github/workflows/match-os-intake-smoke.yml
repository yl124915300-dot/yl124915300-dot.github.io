name: MATCH OS intake deployment smoke
on:
  push:
    paths:
      - 'match-os/index.html'
      - 'match-os/received.html'
      - 'match-os/chat.css'
      - 'match-os/chat.js'
      - 'match-os/catalogs.js'
      - 'match-os/decision.js'
      - 'match-os/results.js'
      - '.github/workflows/match-os-intake-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check chat JavaScript
        run: for file in match-os/*.js; do node --experimental-default-type=module --check "$file"; done
      - name: Verify the deployed chat and receipt against source
        env:
          REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import os
          import time

          base = "https://yl124915300-dot.github.io/match-os/"
          pages = {
              "": "index.html",
              "received.html": "received.html",
              "chat.css": "chat.css",
              "chat.js": "chat.js",
              "catalogs.js": "catalogs.js",
              "decision.js": "decision.js",
              "results.js": "results.js",
          }
          expected = {url: Path("match-os", file).read_bytes() for url, file in pages.items()}
          pending = set(pages)
          for attempt in range(20):
              for path in sorted(pending):
                  request = Request(
                      f"{base}{path}?revision={os.environ['REVISION']}&attempt={attempt}",
                      headers={"Cache-Control": "no-cache", "User-Agent": "MATCH-OS-Deploy-Smoke/1.0"},
                  )
                  try:
                      with urlopen(request, timeout=4) as response:
                          if response.status == 200 and response.read() == expected[path]:
                              pending.remove(path)
                              print("LIVE_OK", pages[path], flush=True)
                  except OSError as error:
                      print(pages[path], error, flush=True)
              if not pending:
                  break
              time.sleep(6)
          if pending:
              raise SystemExit("Deployment does not match source: " + ", ".join(pages[path] for path in sorted(pending)))
          PY
