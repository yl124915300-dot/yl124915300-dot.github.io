name: MATCH OS intake deployment smoke
on:
  push:
    paths:
      - 'match-os/index.html'
      - 'match-os/received.html'
      - '.github/workflows/match-os-intake-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check source JavaScript syntax and live published intake
        shell: bash
        run: |
          python3 - <<'PY'
          import html.parser
          from pathlib import Path
          import subprocess
          import tempfile
          class ScriptParser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(); self.inside=False; self.parts=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag=="script": self.inside=True; self.parts=[]
              def handle_data(self, data):
                  if self.inside: self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag=="script" and self.inside:
                      self.scripts.append("".join(self.parts)); self.inside=False
          for path in ["match-os/index.html","match-os/received.html"]:
              p=ScriptParser()
              p.feed(Path(path).read_text("utf-8"))
              for script in p.scripts:
                  with tempfile.NamedTemporaryFile(mode="w",suffix=".js",encoding="utf-8",delete=False) as f:
                      f.write(script); tmp=f.name
                  subprocess.run(["node","--check",tmp],check=True)
              print("JS_SYNTAX_OK",path,len(p.scripts),flush=True)
          PY
          python3 - <<'PY'
          import urllib.request, time, sys
          base="https://yl124915300-dot.github.io"
          tests=[
            ("/match-os/", ["One request. One transaction.", 'name="transaction_reference"', 'name="fee_acknowledged"', 'MATCH_OS_SUCCESS_ONLY_USD_1_V1', "crypto.randomUUID", "No checkout is available."]),
            ("/match-os/received.html", ["Provisional request reference", "no payment now", "No PayPal payment link is active yet."]),
          ]
          for path,checks in tests:
              last=""
              for attempt in range(12):
                  try:
                      req=urllib.request.Request(base+path+"?matchos_smoke=20261115_paypal_fee",headers={"Cache-Control":"no-cache","User-Agent":"MATCH-OS-Deploy-Smoke/1.0"})
                      with urllib.request.urlopen(req,timeout=20) as response:
                          body=response.read(65000).decode("utf-8")
                          missing=[s for s in checks if s.lower() not in body.lower()]
                          if response.status==200 and not missing:
                              print("LIVE_OK",path,"http",response.status,"checks",len(checks),flush=True)
                              break
                          last=f"http={response.status} missing={missing}"
                  except Exception as e:
                      last=type(e).__name__+":"+str(e)
                  time.sleep(6)
              else:
                  print("LIVE_FAIL",path,last,flush=True)
                  sys.exit(2)
          PY
