name: Cat Tales public HTTPS beta smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cat-tales-public-smoke.yml'
      - 'cat-tales/app/**'
      - 'cat-tales/en/**'
      - 'cat-tales/live/index.html'
      - 'cat-tales/live/beta.js'
      - 'cat-tales/live/beta.e2e.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm actual public HTTPS origin is serving beta release
        env:
          SITE: https://yl124915300-dot.github.io/cat-tales/live/
        run: |
          set -euo pipefail
          for attempt in $(seq 1 22); do
            code=$(curl --silent --show-error --location --max-time 20 \
              --output /tmp/cat-tales-public.html --write-out '%{http_code}' "$SITE" || true)
            if [ "$code" = "200" ] && grep -Fq 'id="beta-test"' /tmp/cat-tales-public.html \
              && grep -Fq 'beta.js?v=20261018g' /tmp/cat-tales-public.html \
              && grep -Fq 'cat-ui.css?v=20261021a' /tmp/cat-tales-public.html \
              && grep -Fq 'cat-ui.js?v=20261021a' /tmp/cat-tales-public.html \
              && curl --fail --silent --show-error --location --max-time 20 \
                 -o /tmp/cat-tales-journal.html "$SITE../app/" \
              && grep -Fq 'paw-app.css?v=20261021a' /tmp/cat-tales-journal.html; then
              echo "PUBLIC_HTML_PASS: HTTP 200, expected beta script and UI are present"
              break
            fi
            if [ "$attempt" -eq 22 ]; then
              echo "::error::Public beta version not served (last HTTP $code)"
              exit 1
            fi
            sleep 12
          done
          for file in beta.js live.js dialogue.js sound-policy.js vision.js cat-ui.css cat-ui.js; do
            curl --fail --show-error --silent --location --max-time 25 \
              -o "/tmp/cat-tales-$file" "$SITE$file"
            test -s "/tmp/cat-tales-$file"
            echo "PUBLIC_ASSET_PASS: $file"
          done
      - name: Confirm deployed observation journal feline stylesheet
        run: curl --fail --show-error --silent --location --max-time 25 -o /tmp/paw-app.css https://yl124915300-dot.github.io/cat-tales/app/paw-app.css && test -s /tmp/paw-app.css
      - name: Confirm English page and scripts are served over public HTTPS
        env:
          ENGLISH_SITE: https://yl124915300-dot.github.io/cat-tales/en/
        run: |
          set -euo pipefail
          for attempt in $(seq 1 22); do
            code=$(curl --silent --show-error --location --max-time 20 --output /tmp/cat-tales-english.html --write-out '%{http_code}' "$ENGLISH_SITE" || true)
            if [ "$code" = "200" ] && grep -Fq 'lang="en"' /tmp/cat-tales-english.html && grep -Fq './app.js?v=20261021a' /tmp/cat-tales-english.html; then
              break
            fi
            if [ "$attempt" -eq 22 ]; then echo "::error::English page not deployed"; exit 1; fi
            sleep 12
          done
          for file in app.js dialogue.js vision.js en.css; do
            curl --fail --silent --show-error --location --max-time 25 -o "/tmp/cat-tales-en-$file" "$ENGLISH_SITE$file"
            test -s "/tmp/cat-tales-en-$file"
          done
      - name: Install isolated Chromium test library
        run: npm install --prefix /tmp/cattales-public --no-save --no-package-lock playwright@1.55.1
      - name: Actual public HTTPS mobile browser feedback test
        env:
          CAT_TALES_TEST_URL: https://yl124915300-dot.github.io/cat-tales/live/
          NODE_PATH: /tmp/cattales-public/node_modules
        run: node cat-tales/live/beta.e2e.cjs

      - name: Actual public HTTPS feline UI and keepsake flow
        env:
          CAT_TALES_TEST_URL: https://yl124915300-dot.github.io/cat-tales/live/
          NODE_PATH: /tmp/cattales-public/node_modules
        run: node cat-tales/live/cat-ui.e2e.cjs

      - name: Public feline observation journal mobile flow
        env:
          CAT_TALES_JOURNAL_URL: https://yl124915300-dot.github.io/cat-tales/app/
          NODE_PATH: /tmp/cattales-public/node_modules
        run: node cat-tales/live/journal-ui.e2e.cjs

      - name: Public English mobile user flow
        env:
          CAT_TALES_EN_TEST_URL: https://yl124915300-dot.github.io/cat-tales/en/
          NODE_PATH: /tmp/cattales-public/node_modules
        run: node cat-tales/en/e2e.cjs
