name: PLI V1.3 bounded real LLM experiment
on:
  push:
    branches: [pli-v13-20261019]
    paths: ['pli-v13/cases.json', 'pli-v13/run.py', 'pli-v13/gate.mjs', 'pli-v13/step.mjs', 'pli-v13/schema.json', 'pli-v13/prompt.txt', '.github/workflows/pli-v13-verify.yml']
permissions:
  contents: read
concurrency:
  group: pli-v13-real-llm
  cancel-in-progress: false
jobs:
  infer:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: write
    outputs:
      checkpoint: ${{ steps.persist.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Syntax and unchanged baseline rules
        run: |
          python3 -m py_compile pli-v13/run.py
          node --check pli-v13/gate.mjs
          node --check pli-v13/step.mjs
          node pli-v12/test.mjs
      - name: Ten bounded real CPU inferences; no API keys, caches or artifacts
        run: python3 pli-v13/run.py
      - name: Persist only bounded synthetic inference evidence on development branch
        id: persist
        if: always()
        run: |
          git config user.name 'PLI V1.3 cloud experiment'
          git config user.email 'pli-v13@users.noreply.github.com'
          if [ -d pli-v13/evidence ]; then
            git add pli-v13/evidence/
            if ! git diff --cached --quiet; then
              git commit -m 'PLI V1.3: record genuine model output, hashes, timing and failures'
              git push origin HEAD:pli-v13-20261019
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  independent-restore:
    needs: infer
    if: needs.infer.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.infer.outputs.checkpoint }}
      - name: Recompute gates and restore state in a separate cloud job
        run: node pli-v13/restore.mjs
      - name: Record independent restoration
        if: always()
        run: |
          git config user.name 'PLI V1.3 independent cloud restore'
          git config user.email 'pli-v13@users.noreply.github.com'
          git add pli-v13/evidence/restore.json
          git commit -m 'PLI V1.3: record independent rule replay and safety evidence'
          git push origin HEAD:pli-v13-20261019
