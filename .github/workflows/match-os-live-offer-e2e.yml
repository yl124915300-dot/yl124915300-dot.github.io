name: MATCH OS live decision comparison
on:
  push:
    paths:
      - 'match-os/*.html'
      - 'match-os/*.js'
      - 'match-os/*.css'
      - 'match-os-probe/decision.test.mjs'
      - 'match-os-probe/browser_compare.py'
      - '.github/workflows/match-os-live-offer-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deterministic comparison rules
        run: node --test match-os-probe/decision.test.mjs
  browser:
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Prepare cloud Chrome
        run: |
          google-chrome --version
          python3 -m pip install --quiet --user playwright==1.55.1
      - name: Wait for the same revision on the original HTTPS site
        env:
          REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import time
          from pathlib import Path
          from urllib.request import urlopen

          names = ['index.html', 'received.html', 'chat.js', 'chat.css', 'catalogs.js', 'decision.js', 'results.js']
          expected = {name: Path('match-os', name).read_bytes() for name in names}
          base = 'https://yl124915300-dot.github.io/match-os/'
          for attempt in range(26):
              try:
                  for name, source in expected.items():
                      url = base + ('' if name == 'index.html' else name) + '?qa=' + os.environ['REVISION'] + '-' + str(attempt)
                      with urlopen(url, timeout=8) as reply:
                          if reply.read() != source:
                              break
                  else:
                      print('PAGES_REVISION_CONFIRMED', os.environ['REVISION'])
                      break
              except OSError:
                  pass
              time.sleep(8)
          else:
              raise SystemExit('Published Pages revision did not match this checkout')
          PY
      - name: Verify real catalog comparisons on desktop and mobile-sized Chrome
        env:
          PYTHONUNBUFFERED: '1'
        run: python3 match-os-probe/browser_compare.py
