name: FlightClaim V0 checks

on:
  push:
    paths:
      - 'flightclaim/**'
      - '.github/workflows/flightclaim-v0.yml'
  pull_request:
    paths:
      - 'flightclaim/**'
      - '.github/workflows/flightclaim-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: EU261 logic, JavaScript syntax and static safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript module syntax
        run: |
          node --check flightclaim/engine.mjs
          node --check flightclaim/app.mjs
          node --check flightclaim/engine.test.mjs
      - name: Run deterministic EU261 scenarios
        run: node --test flightclaim/engine.test.mjs
      - name: Install isolated DOM browser simulator
        run: npm install --prefix flightclaim --no-save --ignore-scripts --no-audit --no-fund jsdom@24.1.3
      - name: Run real UI wizard and local draft integration test
        run: node --test flightclaim/ui.test.mjs
      - name: Verify zero-server-submission pilot contract
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const html = fs.readFileSync("flightclaim/index.html", "utf8");
            const js = fs.readFileSync("flightclaim/app.mjs", "utf8");
            assert.match(html, /Free passenger-rights self-help pilot/);
            assert.match(html, /No online case submission/);
            assert.match(html, /easyjet.com\/en\/claim\/EU261/);
            assert.match(html, /help.ryanair.com/);
            assert.match(js, /localStorage/);
            assert.doesNotMatch(js, /fetch\s*\(|XMLHttpRequest|navigator\.sendBeacon/);
            console.log("Static no-submission checks passed.");
          '

  public-smoke:
    name: Production HTTPS /flightclaim/ readback
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch anonymous public site and JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          base="https://yl124915300-dot.github.io/flightclaim"
          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 15 "$base/" -o /tmp/flightclaim-home.html \
               && grep -q "FlightClaim Agent" /tmp/flightclaim-home.html \
               && curl -fsSL --max-time 15 "$base/app.mjs" -o /tmp/flightclaim-app.mjs \
               && curl -fsSL --max-time 15 "$base/engine.mjs" -o /tmp/flightclaim-engine.mjs \
               && grep -q "RULESET_VERSION" /tmp/flightclaim-engine.mjs; then
                 ok=1; break
            fi
            echo "Anonymous readback not yet consistent (attempt $attempt)"
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then echo "Public site not verified"; exit 1; fi
          node --check /tmp/flightclaim-app.mjs
          node --check /tmp/flightclaim-engine.mjs
          echo "PASS: anonymous HTML + two JS modules returned and passed source/syntax checks."
