name: FlightClaim IndexNow submission

on:
  push:
    branches: [main]
    paths:
      - "flightclaim/**"
      - ".github/workflows/flightclaim-indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flightclaim-indexnow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: flightclaim
          persist-credentials: false
      - name: Verify published content and notify IndexNow
        shell: bash
        run: |
          set -euo pipefail
          host="yl124915300-dot.github.io"
          base="https://$host/flightclaim/"
          key="fcagent20261019e061a9b4c75f28d03a641bfe"
          pages=(
            index.html help.html service.html denied.html radar.html refunds.html
            events/ba563-2026-11-20.html
            events/lh1385-2026-11-19.html
            events/ib420-2026-11-16.html
          )
          [[ "$(<"flightclaim/$key.txt")" == "$key" ]]
          urls=()
          # Pages may combine several pushes into one deployment. Verify what it serves.
          for file in "$key.txt" "${pages[@]}"; do
            url="$base${file#index.html}"
            for attempt in {1..24}; do
              if curl -fsS --max-time 12 "$url?rev=$GITHUB_SHA" -o "$RUNNER_TEMP/live" &&
                 cmp -s "flightclaim/$file" "$RUNNER_TEMP/live"; then
                echo "Verified $url"
                break
              fi
              if [[ $attempt == 24 ]]; then echo "::error::Live content mismatch at $url"; exit 1; fi
              sleep 10
            done
            if [[ "$file" != "$key.txt" ]]; then urls+=("$url"); fi
          done

          jq -n --arg host "$host" --arg key "$key" --arg location "$base$key.txt" \
            '{host:$host, key:$key, keyLocation:$location, urlList:$ARGS.positional}' \
            --args "${urls[@]}" > "$RUNNER_TEMP/request.json"
          code=$(curl -sS --max-time 30 -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/request.json" -o "$RUNNER_TEMP/response" \
            -w '%{http_code}' https://api.indexnow.org/indexnow)
          echo "IndexNow HTTP $code for ${#urls[@]} verified pages"
          case "$code" in
            200) echo "Notification accepted." ;;
            202) echo "Notification received pending key validation." ;;
            *) cat "$RUNNER_TEMP/response"; exit 1 ;;
          esac
