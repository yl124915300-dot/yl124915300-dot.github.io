name: FlightClaim IndexNow submission

on:
  push:
    branches: [main]
    paths:
      - "flightclaim/**"
      - ".github/workflows/flightclaim-indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  notify:
    name: Notify participating search engines (not proof of indexing)
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages deployment of this exact main commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Need Pages build and deployment success for exact SHA: $GITHUB_SHA"
          ready=0
          for attempt in $(seq 1 24); do
            runs="$(curl -fsSL --retry 2 --max-time 15 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=60")"
            match="$(printf '%s' "$runs" | jq -r --arg sha "$GITHUB_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .name == "pages build and deployment" and .status == "completed" and .conclusion == "success")] | length')"
            if [ "$match" -ge 1 ]; then ready=1; break; fi
            echo "Matching Pages deployment not confirmed yet (attempt $attempt)."
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then echo "No verified Pages deployment for this commit. Do not ping stale URL."; exit 1; fi
          echo "Matching Pages deployment completed successfully."
      - name: Verify scoped proof and submit ONE public URL
        shell: bash
        run: |
          set -euo pipefail
          base="https://yl124915300-dot.github.io/flightclaim/"
          key="fcagent20261019e061a9b4c75f28d03a641bfe"
          location="${base}${key}.txt"

          # Allow GitHub Pages publication to catch up with the main commit.
          verified=0
          for attempt in $(seq 1 12); do
            body="$(curl -fsSL --max-time 12 "$location" || true)"
            if [ "$body" = "$key" ]; then verified=1; break; fi
            echo "Key file not deployed yet; attempt $attempt"
            sleep 5
          done
          if [ "$verified" -ne 1 ]; then
            echo "ERROR: host proof unavailable; NOT submitting IndexNow."
            exit 1
          fi
          echo "IndexNow host proof verified."

          code="$(curl -sS --max-time 25 -G \
              --data-urlencode "url=$base" \
              --data-urlencode "key=$key" \
              --data-urlencode "keyLocation=$location" \
              -o /tmp/indexnow-response.txt \
              -w '%{http_code}' \
              'https://api.indexnow.org/indexnow')"
          echo "IndexNow HTTP response code: $code"
          if [ -s /tmp/indexnow-response.txt ]; then head -c 400 /tmp/indexnow-response.txt; echo; fi
          case "$code" in
            200) echo "Accepted by IndexNow. Indexing NOT guaranteed." ;;
            202) echo "Received; engine may be verifying key. Indexing NOT guaranteed." ;;
            *) echo "Rejected or unavailable, not submitted successfully."; exit 1 ;;
          esac
