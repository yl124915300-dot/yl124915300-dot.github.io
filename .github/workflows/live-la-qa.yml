name: Live LA vision + intent browser QA
on:
  push:
    branches: [main]
    paths:
      - 'live-la/**'
      - '.github/workflows/live-la-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Honest pages and JavaScript guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html=Path('live-la/index.html').read_text()
          assert 'Open the official live camera' in html
          assert '<script src="./vision.js" defer></script>' in html
          assert '<script src="./app.js" defer></script>' in html
          assert 'weather-status' not in html
          assert 'no owner-verifiable page-view or checkout event collection' in html
          assert 'A live affiliate link' in html
          assert 'Share live video tab' in html
          assert 'efficacy not yet verified' not in html
          for name in ['app.js','vision.js','smoke.cjs']:
            assert Path('live-la',name).is_file()
          print('First-party intent/opt-in vision + true disclosure checks passed.')
          PY
          node --check live-la/app.js
          node --check live-la/vision.js
          node --check live-la/smoke.cjs
          test -s cat-tales/live/vision-vendor/vision_bundle.mjs
          test -s cat-tales/live/vision-vendor/efficientdet_lite0.tflite
      - name: Obtain public object-recognition fixture for testing only
        run: |
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 75 \
            -o live-la/vision-fixture.jpg \
            https://storage.googleapis.com/mediapipe-tasks/object_detector/cat_and_dog.jpg
          test "$(stat -c%s live-la/vision-fixture.jpg)" -gt 10000
      - name: Install isolated test browser
        run: |
          npm install --prefix /tmp/live-la-qa --no-package-lock --no-save playwright@1.55.1
          /tmp/live-la-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve static site
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/live-la-qa-http.log 2>&1 &
          sleep 2
      - name: Actual local EfficientDet image and synthetic live video inference plus buyer-matching QA
        env:
          NODE_PATH: /tmp/live-la-qa/node_modules
        run: node live-la/smoke.cjs
