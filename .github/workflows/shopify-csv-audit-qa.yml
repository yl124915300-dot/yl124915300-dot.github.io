name: Catalog Check QA
on:
  push:
    branches:
      - business-hub-selfserve-mvp-20261116
      - catalog-check-conversion-20261116
      - main
    paths:
      - 'shopify-csv-audit/**'
      - '.github/workflows/shopify-csv-audit-qa.yml'
  workflow_dispatch:
jobs:
  product-csv-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run local parser and audit tests
        run: node --test shopify-csv-audit/audit.test.mjs
      - name: Verify public static assets
        run: |
          test -s shopify-csv-audit/index.html
          test -s shopify-csv-audit/audit.mjs
          test -s shopify-csv-audit/sample.csv
          grep -q 'audit.mjs' shopify-csv-audit/index.html
          grep -q 'Paid orders are' shopify-csv-audit/index.html
