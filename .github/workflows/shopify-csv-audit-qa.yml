name: Catalog Check QA
on:
  push:
    branches:
      - business-hub-selfserve-mvp-20261116
      - catalog-check-conversion-20261116
      - catalog-check-inventory-guard-20261116
      - main
    paths:
      - 'shopify-csv-audit/**'
      - '.github/workflows/shopify-csv-audit-qa.yml'
  workflow_dispatch:
jobs:
  product-csv-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run local parser and audit tests
        run: node --test shopify-csv-audit/audit.test.mjs shopify-csv-audit/openai-feed.test.mjs
      - name: Verify public static assets
        run: |
          test -s shopify-csv-audit/index.html
          test -s shopify-csv-audit/audit.mjs
          test -s shopify-csv-audit/openai-feed.mjs
          test -s shopify-csv-audit/openai-feed.test.mjs
          test -s shopify-csv-audit/sample.csv
          grep -q 'audit.mjs' shopify-csv-audit/index.html
          grep -q 'Paid orders are' shopify-csv-audit/index.html
      - name: Install isolated Chromium browser
        run: |
          npm install --prefix /tmp/catalog-check-qa --no-package-lock --no-save playwright@1.55.1
          /tmp/catalog-check-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve owned static site locally
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory . > /tmp/catalog-check-http.log 2>&1 &
          sleep 2
      - name: Actual browser scan and mobile checkout-disclosure smoke
        env:
          NODE_PATH: /tmp/catalog-check-qa/node_modules
        run: node shopify-csv-audit/browser-smoke.cjs

