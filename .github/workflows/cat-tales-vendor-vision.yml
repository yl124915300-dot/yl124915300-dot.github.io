name: Cat Tales vendor vision assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cat-tales-vendor-vision.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor-vision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned MediaPipe vision runtime (Apache-2.0)
        run: |
          set -euo pipefail
          npm install --prefix /tmp/cattales-vision --no-save --no-package-lock @mediapipe/tasks-vision@0.10.35
          PKG=/tmp/cattales-vision/node_modules/@mediapipe/tasks-vision
          test -s "$PKG/vision_bundle.mjs"
          test -d "$PKG/wasm"
          mkdir -p cat-tales/live/vision-vendor
          cp "$PKG/vision_bundle.mjs" cat-tales/live/vision-vendor/vision_bundle.mjs
          cp -R "$PKG/wasm" cat-tales/live/vision-vendor/wasm
          test -s cat-tales/live/vision-vendor/wasm/vision_wasm_internal.wasm
      - name: Fetch official EfficientDet-Lite0 int8 COCO detection model
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 150 -o cat-tales/live/vision-vendor/efficientdet_lite0.tflite \
            https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite
          test "$(stat -c%s cat-tales/live/vision-vendor/efficientdet_lite0.tflite)" -gt 100000
          file cat-tales/live/vision-vendor/efficientdet_lite0.tflite
      - name: Provenance and integrity record
        run: |
          cat >cat-tales/live/vision-vendor/ATTRIBUTION.md <<'EOF'
          # Third-party Vision Assets
          - MediaPipe Tasks Vision @0.10.35 runtime, Apache-2.0, https://github.com/google-ai-edge/mediapipe
          - Google's official EfficientDet-Lite0 int8 COCO object detector, https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite
          - Object classes (cat, dog, person, etc.) indicate bounding-box candidates only. The model does not understand emotions, vocalization sources, body language or cat-language semantics.
          - Vision inference occurs locally in an authorized browser. MediaPipe may process non-media performance metrics; see https://developers.google.com/edge/mediapipe/solutions/tasks
          - Source sample image (used only transiently in CI, not distributed) is Google's MediaPipe example from Pixabay, https://storage.googleapis.com/mediapipe-tasks/object_detector/cat_and_dog.jpg
          EOF
          sha256sum cat-tales/live/vision-vendor/vision_bundle.mjs cat-tales/live/vision-vendor/efficientdet_lite0.tflite >cat-tales/live/vision-vendor/SHA256SUMS
          du -h cat-tales/live/vision-vendor/efficientdet_lite0.tflite cat-tales/live/vision-vendor/wasm/*
      - name: Commit pinned local vision runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cat-tales/live/vision-vendor
          if git diff --cached --quiet; then
            echo "Assets unchanged"
          else
            git commit -m "cat-tales: vendor pinned on-device cat visual detector"
            git pull --rebase origin main
            git push
          fi
