name: Catalog Check live discovery
on:
  push:
    branches: [main]
    paths: ['shopify-csv-audit/**', 'sitemap.xml', '.github/workflows/catalog-check-live-discovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-check-live-discovery
  cancel-in-progress: true
jobs:
  verify-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for exact Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            count="$(curl -fsSL --max-time 15 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .name == "pages build and deployment" and .status == "completed" and .conclusion == "success")] | length')"
            if [ "$count" -gt 0 ]; then echo "Pages deployed: $GITHUB_SHA"; exit 0; fi
            sleep 8
          done
          echo "Pages deployment unconfirmed, no indexing request."
          exit 1
      - name: Verify public entrypoint and guide assets
        shell: bash
        run: |
          set -euo pipefail
          host="yl124915300-dot.github.io"
          base="https://$host/shopify-csv-audit/"
          key="5b6be22d1f9d4641a83ab30909f4cb52"
          test "$(curl -fsSL --max-time 20 "https://$host/$key.txt")" = "$key"
          page="$(curl -fsSL --max-time 20 "$base")"
          script="$(curl -fsSL --max-time 20 "$base"audit.mjs)"
          sample="$(curl -fsSL --max-time 20 "$base"sample.csv)"
          guide1="$(curl -fsSL --max-time 20 "$base"variant-deletion-risk/)"
          guide2="$(curl -fsSL --max-time 20 "$base"import-errors/)"
          [[ "$page" == *'Check your product CSV before a costly mistake.'* ]]
          [[ "$page" == *'merchant%20pilot%20enquiry'* ]]
          [[ "$script" == *'Duplicate variant combination'* && "$script" == *'Compare-at price'* ]]
          [[ "$sample" == *'trail-bag'* ]]
          [[ "$guide1" == *'Can a Shopify CSV import delete your variants?'* ]]
          [[ "$guide2" == *'Shopify CSV import errors: what to fix first'* ]]
          echo "Live public files matched current features."
      - name: Request IndexNow discovery for three owned URLs only
        shell: bash
        run: |
          set -euo pipefail
          host="yl124915300-dot.github.io"
          key="5b6be22d1f9d4641a83ab30909f4cb52"
          proof="https://$host/$key.txt"
          for path in shopify-csv-audit/ shopify-csv-audit/variant-deletion-risk/ shopify-csv-audit/import-errors/; do
            url="https://$host/$path"
            status="$(curl -sS -G --max-time 25 --data-urlencode "url=$url" --data-urlencode "key=$key" --data-urlencode "keyLocation=$proof" -o /tmp/catalog-indexnow.txt -w '%{http_code}' https://api.indexnow.org/indexnow)"
            echo "$path IndexNow HTTP $status"
            case "$status" in
              200|202) echo "Submitted; not proof of indexing, traffic or purchase." ;;
              *) head -c 350 /tmp/catalog-indexnow.txt || true; exit 1 ;;
            esac
          done
