name: Policy Radar UK official-source watch

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/policy-radar-official-sources.yml"
      - "policy-radar/monitor.py"
      - "policy-radar/build_feeds.py"
      - "policy-radar/discover.py"
      - "policy-radar/data/approved_events.json"
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: policy-radar-source-watch
  cancel-in-progress: false

jobs:
  official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out site repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh against latest upstream before every save attempt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "policy-radar-bot"
          git config user.email "policy-radar-bot@users.noreply.github.com"
          # This job only generates files inside policy-radar. The runner is
          # disposable. Never force push or overwrite concurrent human edits.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            # Always regenerate from the newest approved items and latest
            # editorial queue. A stale snapshot is discarded, not rebased.
            python3 policy-radar/monitor.py
            python3 policy-radar/discover.py
            python3 policy-radar/build_feeds.py
            git add policy-radar/data/source_status.json \
                    policy-radar/data/discovery_queue.json \
                    policy-radar/updates.xml \
                    policy-radar/calendar.ics \
                    policy-radar/feeds/
            if git diff --cached --quiet; then
              echo "No changes to the source snapshots or reviewed feeds"
              exit 0
            fi
            git commit -m "Policy Radar: refresh verified public source snapshots"
            if git push origin HEAD:main; then
              echo "Official source snapshot saved from latest main"
              exit 0
            fi
            echo "Concurrent repo update detected. Rebuilding from newest main."
            sleep $((attempt * 5))
          done
          echo "Could not safely save the source snapshot after three attempts"
          exit 1
