name: Policy Radar UK official-source watch

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/policy-radar-official-sources.yml"
      - "policy-radar/monitor.py"
      - "policy-radar/build_feeds.py"
      - "policy-radar/discover.py"
      - "policy-radar/data/approved_events.json"
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: policy-radar-source-watch
  cancel-in-progress: false

jobs:
  official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out site repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read source snapshots without interpreting entitlement
        run: python3 policy-radar/monitor.py
      - name: Discover possible new GOV.UK policy notices
        run: python3 policy-radar/discover.py
      - name: Generate public reviewed RSS and iCalendar feeds
        run: python3 policy-radar/build_feeds.py
      - name: Commit traceable source-check status if changed
        run: |
          git add policy-radar/data/source_status.json policy-radar/data/discovery_queue.json policy-radar/updates.xml policy-radar/calendar.ics
          if git diff --cached --quiet; then
            echo "No status change"
            exit 0
          fi
          git config user.name "policy-radar-bot"
          git config user.email "policy-radar-bot@users.noreply.github.com"
          git commit -m "Policy Radar: update official source check status"
          # The shared Pages repository receives unrelated site commits.
          # Rebase the bot-only data commit against the newest main branch.
          # Never force-push; if the same data changed concurrently, fail safely.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Conflict while merging monitoring data; manual resolution required"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Source-monitor snapshot saved"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Could not save updated snapshot after 3 attempts"
          exit 1
