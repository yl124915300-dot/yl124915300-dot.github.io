name: Policy Radar UK official-source watch

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/policy-radar-official-sources.yml"
      - "policy-radar/monitor.py"
      - "policy-radar/build_feeds.py"
      - "policy-radar/discover.py"
      - "policy-radar/data/approved_events.json"
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: policy-radar-source-watch
  cancel-in-progress: false

jobs:
  official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out site repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh against latest upstream before every save attempt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "policy-radar-bot"
          git config user.email "policy-radar-bot@users.noreply.github.com"
          # This job only generates files inside policy-radar. The runner is
          # disposable. Never force push or overwrite concurrent human edits.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            # Always regenerate from the newest approved items and latest
            # editorial queue. A stale snapshot is discarded, not rebased.
            python3 policy-radar/monitor.py
            python3 policy-radar/discover.py
            python3 policy-radar/build_feeds.py
            git add policy-radar/data/source_status.json \
                    policy-radar/data/discovery_queue.json \
                    policy-radar/updates.xml \
                    policy-radar/calendar.ics \
                    policy-radar/feeds/
            if git diff --cached --quiet; then
              echo "No changes to the source snapshots or reviewed feeds"
              exit 0
            fi
            git commit -m "Policy Radar: refresh verified public source snapshots"
            if git push origin HEAD:main; then
              echo "Official source snapshot saved from latest main"
              exit 0
            fi
            echo "Concurrent repo update detected. Rebuilding from newest main."
            sleep $((attempt * 5))
          done
          echo "Could not safely save the source snapshot after three attempts"
          exit 1
      - name: Audit source health and flag human-review tasks
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          path=pathlib.Path("policy-radar/data/source_status.json")
          summary=os.environ.get("GITHUB_STEP_SUMMARY")
          def say(line):
              print(line)
              if summary:
                  with open(summary, "a", encoding="utf-8") as output:
                      output.write(line + "\n")
          say("## Policy Radar UK — official-source audit")
          if not path.exists():
              say("**FAIL:** No official-source snapshot was produced or retained.")
              raise SystemExit(1)
          try:
              d=json.loads(path.read_text(encoding="utf-8"))
          except (ValueError,OSError):
              say("**FAIL:** The snapshot is unreadable.")
              raise SystemExit(1)
          sources=d.get("sources",[])
          if not isinstance(sources,list) or not sources:
              say("**FAIL:** The source list is empty.")
              raise SystemExit(1)
          errors=[x for x in sources if x.get("fetch_status")!="ok"]
          pending=[x for x in sources if x.get("pending_human_review")]
          say(f"Snapshot: {d.get('last_checked_utc','unknown')} · {len(sources)-len(errors)}/{len(sources)} fetched · {len(pending)} awaiting editorial review")
          if errors:
              say("**Fetch failures — manual check required:**")
              for x in errors:
                  say(f"- {str(x.get('id','unknown'))[:90]}: {str(x.get('error','no reason'))[:180]}")
          if pending:
              say("**Possible government-page changes — NOT verified policy decisions:**")
              for x in pending:
                  diff=x.get("signal_diff",{})
                  say(f"- {str(x.get('id','unknown'))[:90]} · official source: {str(x.get('official_url',''))[:200]}")
                  if diff:
                      say(f"  - Amount/date token differences: {str(diff)[:280]}")
              say("Human editorial verification is required before updating public policy guidance.")
          if errors or pending:
              say("**Action needed:** Investigate the failing or changed sources. No unverified changes have been published.")
              raise SystemExit(1)
          say("Source fetches succeeded, and no fingerprint changes are awaiting review. This does NOT certify legal accuracy or completeness.")
          PY
