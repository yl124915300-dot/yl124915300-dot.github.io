name: Submit live LA intent guide to IndexNow

on:
  push:
    branches: [main]
    paths:
      - "live-la/index.html"
      - ".github/workflows/live-la-indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for this revision's Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            count="$(curl -fsSL --max-time 15 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
              | jq -r --arg sha "$GITHUB_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .name == "pages build and deployment" and .status == "completed" and .conclusion == "success")] | length')"
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 10
          done
          echo "Pages build not proven for this commit; no indexing request sent."
          exit 1
      - name: Submit only the new original-value travel guide
        shell: bash
        run: |
          set -euo pipefail
          url="https://yl124915300-dot.github.io/live-la/"
          key="5b6be22d1f9d4641a83ab30909f4cb52"
          proof="https://yl124915300-dot.github.io/5b6be22d1f9d4641a83ab30909f4cb52.txt"
          actual="$(curl -fsSL --max-time 20 "$proof")"
          [ "$actual" = "$key" ] || { echo "Existing domain key not verified."; exit 1; }
          page="$(curl -fsSL --max-time 20 "$url")"
          if [[ "$page" != *'Santa Monica live beach cam'* || "$page" != *'id="planner"'* ]]; then
            echo "Expected page/intent tool not publicly readable."; exit 1
          fi
          status="$(curl -sS -G --max-time 25 \
            --data-urlencode "url=$url" \
            --data-urlencode "key=$key" \
            --data-urlencode "keyLocation=$proof" \
            -o /tmp/indexnow-response.txt -w '%{http_code}' https://api.indexnow.org/indexnow)"
          echo "IndexNow HTTP status: $status; 200/202 does not mean indexed, visited or purchased."
          case "$status" in
            200|202) echo "IndexNow request accepted." ;;
            *) head -c 200 /tmp/indexnow-response.txt || true; exit 1 ;;
          esac
