name: Cat Tales V10 expanded negative stress test (research only)
on:
  push:
    branches:
      - cat-tales/v10-noise-stress-20261018
    paths:
      - '.github/workflows/cat-tales-v10-noise-stress.yml'
permissions:
  contents: write
jobs:
  zero-shot-research:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      HF_HUB_DISABLE_XET: '1'
      PYTHONUNBUFFERED: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch and open model dependencies
        run: |
          python -m pip install --disable-pip-version-check --progress-bar off torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --progress-bar off tensorflow-cpu==2.17.1 tensorflow-hub==0.16.1 tf-keras==2.17.0 transformers==4.46.3 huggingface-hub==0.26.2 safetensors==0.4.5 soundfile==0.13.1 scipy==1.14.1
      - name: Validate source script syntax, run real frozen pretrained inference
        run: |
          python -m py_compile cat-tales/research/v09_pair.py
          python cat-tales/research/v09_pair.py
      - name: Save results to isolated branch without redistributing source media
        if: always()
        shell: bash
        run: |
          mkdir -p cat-tales/evidence/v10-noise-stress
          if test -f cat_tales_v09_paired.json; then
            cp cat_tales_v09_paired.json cat-tales/evidence/v09-clap-paired/result.json
          else
            python - <<'PY'
          import json,os,pathlib
          result={"status":"NOT_RUN_PREREQUISITE_FAILURE",
                  "run_url":"https://github.com/"+os.getenv("GITHUB_REPOSITORY","")+"/actions/runs/"+os.getenv("GITHUB_RUN_ID",""),
                  "trained_or_published_media":False}
          pathlib.Path("cat-tales/evidence/v09-clap-paired/result.json").write_text(json.dumps(result,indent=2))
          PY
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cat-tales/evidence/v09-clap-paired/result.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(cat-tales): V10 expanded real-audio research-only paired run"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
