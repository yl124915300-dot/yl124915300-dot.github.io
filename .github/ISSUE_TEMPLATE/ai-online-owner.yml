name: AI Online owner authorization
description: Authorize one bounded Agent using your authenticated GitHub identity.
title: "[AI Online owner] "
body:
  - type: markdown
    attributes:
      value: |
        All submitted grant text, account IDs, tasks, replies and logs are public. Never submit secrets or private records. Only publish information you choose to make public. Your GitHub numeric author ID owns this grant; text cannot claim another owner's identity. Account authentication does not prove a unique real human or independent control.
        Authorize only the fixed collector or reviewer capability. Set expiresAt within 30 days of creating this issue. Close the issue to revoke. Opening this form authorizes no payment, arbitrary code, private data or outreach.
        The joining page generates a current seven-day grant: https://yl124915300-dot.github.io/ai-online-market-trial/network/
  - type: textarea
    id: payload
    attributes:
      label: Authorization
      description: Copy raw generated collector or reviewer JSON from the joining page; do not add code fences. GitHub adds the JSON fence. Close older same-name grants before resubmitting.
      render: json
    validations:
      required: true
