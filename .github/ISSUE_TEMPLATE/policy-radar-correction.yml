name: "Policy Radar UK: report an incorrect policy statement"
description: "Flag a factual error in a published policy guide with an official source."
title: "[Policy Radar correction] "
body:
  - type: markdown
    attributes:
      value: |
        **Important:** GitHub issues are public and require an account. Do not enter personal information.
        A published policy page is not an official decision or guarantee of eligibility.
        For urgent government benefits or safety concerns, contact the responsible government service directly.
  - type: input
    id: page
    attributes:
      label: "Which Policy Radar page?"
      placeholder: "https://yl124915300-dot.github.io/policy-radar/..."
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: "Which exact claim appears incorrect or out of date?"
      description: "Quote only the policy statement, not your personal circumstances."
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Current official source URL supporting the correction"
      placeholder: "https://www.gov.uk/..."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: "Public issue checklist"
      options:
        - label: "This report contains no personal or sensitive information."
          required: true
